name: Quality Gate

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    name: Backend compile and security unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.0.2 httpx==0.28.1 cryptography==46.0.5
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run focused backend tests
        working-directory: backend
        run: python -m pytest -q tests/test_sns_security.py tests/test_report_rules.py

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install locked dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run sanitizer tests
        working-directory: frontend
        run: CI=true yarn test --watchAll=false --runTestsByPath src/lib/sanitizeHtml.test.js
      - name: Build production frontend
        working-directory: frontend
        run: CI=true npx craco build
