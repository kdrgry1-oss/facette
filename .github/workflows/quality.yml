name: Quality Gate

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    name: Backend compile and security unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.0.2 pytest-asyncio fastapi pydantic httpx==0.28.1 cryptography==46.0.5
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run focused backend tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          backend/tests/test_sns_security.py
          backend/tests/test_report_rules.py
          backend/tests/test_open_return_rules.py
          backend/tests/test_stock_audit.py
          backend/tests/test_activity_audit.py
          backend/tests/amazon_helpers_test.py
          backend/tests/test_themes.py
          backend/tests/test_google_auth_flow.py
          backend/tests/test_email_brevo.py
          tests/seo_runtime_test.py
          tests/tenant_config_test.py

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install locked dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        run: CI=true yarn test --watchAll=false --runInBand
      - name: Build production frontend
        working-directory: frontend
        run: CI=true npx craco build
