# Codemagic — Facette iOS (App Store) bulut derleme tarifi.
# Yerel Xcode/Mac GEREKMEZ: Codemagic bulut Mac'te güncel Xcode ile derler ve
# doğrudan TestFlight'a yükler.
#
# ÖN KOŞULLAR (Codemagic panelinde, bir kez):
#   1) Team settings → Integrations → App Store Connect → API key ekle
#      (App Store Connect'ten indirdiğin .p8 + Key ID + Issuer ID).
#      Bu entegrasyona verdiğin İSİM aşağıdaki `app_store_connect: CodemagicKey`
#      ile AYNI olmalı.
#   2) App Store Connect'teki uygulamanın (Facette Admin) Bundle ID'si `com.facette.app`
#      olmalı (farklıysa aşağıdaki bundle_identifier'ı ona göre değiştir).
# NOT: Canlı backend adresi (api.facette.com.tr) yaml'a GÖMÜLÜ (gizli değil) — env var GEREKMEZ.

workflows:
  ios-facette:
    name: Facette iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: CodemagicKey     # ← Codemagic'te eklediğin API key adı
    environment:
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.facette.app"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Web build (React) + Capacitor sync
        script: |
          cd frontend
          yarn install --frozen-lockfile || yarn install
          # Canlı API adresi (Cloudflare'dekiyle aynı) — doğrudan gömülü, env var gerekmez.
          echo "REACT_APP_BACKEND_URL=https://api.facette.com.tr" > .env
          yarn build
          npx cap sync ios
      - name: CocoaPods
        script: |
          cd frontend/ios/App
          pod install
      - name: Kod imzalama — sertifika + profil OTOMATİK oluştur/çek
        script: |
          set -e
          keychain initialize

          # --- TEŞHİS: API key gerçekten sertifika oluşturabiliyor mu? ---
          # App Manager rolü DAĞITIM sertifikası OLUŞTURAMAZ (Apple kuralı: Admin gerekir).
          # Aşağıdaki liste boş dönüyorsa ve --create de üretmiyorsa → key rolü yetersiz.
          echo "=== Mevcut DAĞITIM (IOS_DISTRIBUTION) sertifikaları ==="
          app-store-connect list-certificates --type IOS_DISTRIBUTION --json || true

          # Dağıtım sertifikası YOKSA oluştur (Admin rolü şart), VARSA yerel keychain'e kur.
          # --create ile hem sertifika hem App Store provizyon profili gelir/oluşur.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          echo "=== fetch SONRASI sertifikalar (üretildi mi?) ==="
          app-store-connect list-certificates --type IOS_DISTRIBUTION --json || true

          keychain add-certificates

          echo "=== keychain'de kurulu imza kimlikleri ==="
          keychain list-identities || true

          # use-profiles PROJE KLASÖRÜNDEN çalışmalı ki App.xcodeproj'u bulup manuel imzaya
          # çevirsin (proje Automatic + team tanımsız geldiği için repo kökünden boş geçiyordu).
          cd frontend/ios/App
          xcode-project use-profiles
      - name: IPA derle
        script: |
          cd frontend/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true       # otomatik TestFlight'a yükle
        # submit_to_app_store: false     # incelemeye göndermeyi sonra açarsın
